<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title id="title">codex-manager icon</title>
  <desc id="desc">A rounded dark app icon with a terminal prompt, session lines, and a search lens.</desc>
  <defs>
    <linearGradient id="bg" x1="42" y1="28" x2="214" y2="228" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10223f"/>
      <stop offset=".55" stop-color="#071426"/>
      <stop offset="1" stop-color="#03111f"/>
    </linearGradient>
    <linearGradient id="panel" x1="48" y1="54" x2="203" y2="197" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#122b47"/>
      <stop offset="1" stop-color="#081827"/>
    </linearGradient>
    <linearGradient id="cyan" x1="62" y1="76" x2="168" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a7f3ff"/>
      <stop offset=".55" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="gold" x1="152" y1="150" x2="219" y2="211" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fde68a"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity=".42"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="216" height="216" rx="50" fill="url(#bg)" filter="url(#soft-shadow)"/>
  <rect x="27" y="27" width="202" height="202" rx="43" fill="none" stroke="#1e3a5f" stroke-width="2.5" opacity=".95"/>

  <rect x="48" y="54" width="160" height="148" rx="24" fill="url(#panel)" stroke="#244766" stroke-width="4"/>
  <path d="M48 82h160" fill="none" stroke="#244766" stroke-width="4"/>
  <circle cx="71" cy="68" r="5" fill="#ef4444"/>
  <circle cx="89" cy="68" r="5" fill="#f59e0b"/>
  <circle cx="107" cy="68" r="5" fill="#22c55e"/>

  <path d="M79 99l40 29-40 29" fill="none" stroke="url(#cyan)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M122 159h39" fill="none" stroke="#dbeafe" stroke-width="16" stroke-linecap="round" opacity=".92"/>

  <path d="M145 96h38" fill="none" stroke="#7dd3fc" stroke-width="10" stroke-linecap="round" opacity=".9"/>
  <path d="M151 119h31" fill="none" stroke="#22c55e" stroke-width="10" stroke-linecap="round" opacity=".92"/>
  <path d="M158 142h23" fill="none" stroke="#93c5fd" stroke-width="10" stroke-linecap="round" opacity=".86"/>

  <circle cx="180" cy="174" r="24" fill="#071426" stroke="url(#gold)" stroke-width="12"/>
  <path d="M198 192l20 20" fill="none" stroke="url(#gold)" stroke-width="13" stroke-linecap="round"/>
</svg>
