{{ define "style" }}
<style>
:root {
  --bg: #0c1112;
  --panel: #141b1c;
  --ink: #e2f0ee;
  --muted: #8fa6a3;
  --accent: #49c1b5;
  --border: #243033;
  --border-strong: #3b4a4f;
  --user: #15333a;
  --assistant: #223034;
  --tool: #1a2b27;
  --system: #1a2123;
  --error: #3a1f22;
  --bg-glow: #142529;
  --banner: #0f1718;
  --code: #0a1112;
  --speaker-agent-bg: #163847;
  --speaker-agent-border: rgba(102, 199, 232, 0.42);
  --speaker-agent-glow: rgba(102, 199, 232, 0.16);
  --speaker-subagent-bg: #18281c;
  --speaker-subagent-border: rgba(146, 196, 96, 0.42);
  --speaker-subagent-glow: rgba(146, 196, 96, 0.16);
  --speaker-user-bg: #3a2918;
  --speaker-user-border: rgba(211, 154, 82, 0.42);
  --speaker-user-glow: rgba(211, 154, 82, 0.16);
  --speaker-auto-bg: #172124;
}
body.theme-noir-blue {
  --bg: #0b0f14;
  --panel: #151b24;
  --ink: #e6e9f0;
  --muted: #9aa5b1;
  --accent: #7fb6ff;
  --border: #263243;
  --border-strong: #3b4a60;
  --user: #1e2f4d;
  --assistant: #243041;
  --tool: #1b2b2a;
  --system: #1c2330;
  --error: #3a1f25;
  --bg-glow: #192235;
  --banner: #101826;
  --code: #0c111b;
}
body.theme-espresso-amber {
  --bg: #12100c;
  --panel: #1c1812;
  --ink: #f2e8da;
  --muted: #b09b84;
  --accent: #e0a35c;
  --border: #332a21;
  --border-strong: #4a3c2d;
  --user: #2c2318;
  --assistant: #2a241b;
  --tool: #2a2319;
  --system: #251f17;
  --error: #3a1f1a;
  --bg-glow: #201a13;
  --banner: #17130f;
  --code: #0f0c08;
}
body.theme-graphite-teal {
  --bg: #0c1112;
  --panel: #141b1c;
  --ink: #e2f0ee;
  --muted: #8fa6a3;
  --accent: #49c1b5;
  --border: #243033;
  --border-strong: #3b4a4f;
  --user: #15333a;
  --assistant: #223034;
  --tool: #1a2b27;
  --system: #1a2123;
  --error: #3a1f22;
  --bg-glow: #142529;
  --banner: #0f1718;
  --code: #0a1112;
}
body.theme-obsidian-lime {
  --bg: #0e1110;
  --panel: #151b17;
  --ink: #e8f3e3;
  --muted: #9eb39a;
  --accent: #9ad36a;
  --border: #243228;
  --border-strong: #3b4b3c;
  --user: #1f2f23;
  --assistant: #223025;
  --tool: #1d2a1f;
  --system: #1b231d;
  --error: #3b1f20;
  --bg-glow: #1a2a1d;
  --banner: #111914;
  --code: #0b100d;
}
body.theme-ink-rose {
  --bg: #110e12;
  --panel: #1a151c;
  --ink: #f0e5ef;
  --muted: #b59bb0;
  --accent: #e06c9f;
  --border: #33263a;
  --border-strong: #4a3b4f;
  --user: #2f1c2a;
  --assistant: #2b202a;
  --tool: #2a1c27;
  --system: #241a22;
  --error: #3b1f27;
  --bg-glow: #241722;
  --banner: #171118;
  --code: #0d0a10;
}
body.theme-iron-cyan {
  --bg: #0b1012;
  --panel: #141a1e;
  --ink: #e4edf2;
  --muted: #9aaab5;
  --accent: #5cc7e6;
  --border: #24313a;
  --border-strong: #3a4a56;
  --user: #1d2e3a;
  --assistant: #222c33;
  --tool: #1b2a2f;
  --system: #1b2226;
  --error: #3a1f23;
  --bg-glow: #16252f;
  --banner: #10181d;
  --code: #0b1014;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  padding: 0;
  background: radial-gradient(circle at top left, var(--bg-glow), var(--bg));
  color: var(--ink);
  font-family: "SFMono-Regular", "Menlo", "Monaco", "Courier New", monospace;
}
header {
  padding: 24px 32px 8px;
}
header.sticky-header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 20;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 12px 22px rgba(0, 0, 0, 0.25);
}
body.has-sticky-header main {
  padding-top: var(--sticky-offset, 180px);
}
header a {
  color: var(--accent);
  text-decoration: none;
}
.cwd-link {
  color: var(--accent);
  text-decoration: none;
}
.nav-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--accent);
  padding: 2px 8px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.nav-btn:hover {
  background: var(--border);
}
.nav-btn.disabled {
  opacity: 0.45;
  cursor: default;
  pointer-events: none;
}
.tabs {
  margin-top: 10px;
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
}
.tabs-secondary {
  margin-top: 6px;
}
.tab {
  padding: 6px 12px;
  border-radius: 999px;
  border: 1px solid var(--border);
  color: var(--muted);
  text-decoration: none;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
}
.tabs-secondary .tab {
  font-size: 11px;
  padding: 5px 10px;
  letter-spacing: 0.06em;
}
.tab-label {
  align-self: center;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
  padding: 4px 2px;
}
.tab:hover {
  color: var(--ink);
}
.tab.active {
  color: var(--ink);
  background: var(--panel);
  border-color: var(--accent);
}
main {
  padding: 0 32px 48px;
}
.page-title {
  font-size: 32px;
  margin: 0 0 8px;
}
.page-title .title-links {
  font-size: 14px;
  font-weight: normal;
  margin-left: 6px;
}
.page-title .title-link {
  font-size: 14px;
  font-weight: normal;
}
.subtitle {
  color: var(--muted);
  margin: 0;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border-strong);
  border-radius: 12px;
  padding: 16px 20px;
  margin: 16px 0;
  box-shadow: 0 10px 30px rgba(40, 30, 20, 0.05);
}
.search-card {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.search-label {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--muted);
}
.search-input {
  width: 100%;
  padding: 10px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--code);
  color: var(--ink);
  font-size: 14px;
  font-family: inherit;
}
.search-input:focus {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.search-status {
  margin: 0;
}
.search-results {
  margin: 0;
}
.search-result-link {
  display: block;
  color: var(--accent);
  text-decoration: none;
  word-break: break-word;
}
.search-result-link:hover {
  text-decoration: underline;
}
.search-result-meta {
  display: block;
  margin-top: 2px;
}
.search-result-snippet {
  margin-top: 8px;
  font-size: 13px;
  color: var(--ink);
}
.search-results mark {
  background: var(--accent);
  color: var(--bg);
  padding: 0 3px;
  border-radius: 4px;
}
.list {
  list-style: none;
  padding: 0;
  margin: 0;
}
.list li {
  border-bottom: 1px dashed var(--border);
}
.list li:last-child {
  border-bottom: none;
}
.dir-item {
  padding: 0;
  margin: 8px 0;
  border-radius: 10px;
  border: 1px solid rgba(255, 255, 255, 0.06);
  border-bottom: none;
  background-clip: padding-box;
}
.dir-filter-controls {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 8px;
}
.dir-filter-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
  cursor: pointer;
}
.dir-filter-checkbox {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}
.dir-filter-empty {
  margin: 6px 0 0;
}
.dir-filter-item {
  padding: 0;
  border-radius: 10px;
}
.dir-filter-item.selected {
  border: 1px solid rgba(92, 199, 230, 0.55);
  background: rgba(92, 199, 230, 0.18);
  box-shadow: inset 0 0 0 1px rgba(92, 199, 230, 0.2);
}
.link-list a {
  color: var(--ink);
  text-decoration: none;
}
.link-item-link {
  display: block;
  width: 100%;
  padding: 10px 0;
  border-radius: 8px;
  color: var(--ink);
  text-decoration: none;
  transition: background-color 0.15s ease;
}
.session-snippet {
  margin-top: 10px;
}
.session-snippet-thread {
  display: grid;
  gap: 10px;
}
.snippet-divider {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  letter-spacing: 0.2em;
}
.snippet-link {
  display: block;
  color: inherit;
  text-decoration: none;
}
.snippet-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.session-snippet-thread .session-item {
  margin-bottom: 0;
  padding: 10px 12px;
}
.session-snippet-thread .snippet-item-left {
  margin-right: 33%;
}
.session-snippet-thread .snippet-item-right {
  margin-left: 33%;
}
.session-snippet-thread .session-content {
  font-size: 13px;
  line-height: 1.5;
}
.snippet-speaker {
  margin: 0 0 6px;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
}
.session-list-item {
  padding: 10px;
  border-radius: 10px;
  transition: box-shadow 0.15s ease;
}
.active-list {
  display: grid;
  gap: 12px;
}
.active-list li {
  border-bottom: none;
}
.active-date-divider {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 2px 4px;
  color: var(--muted);
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.active-date-divider::before,
.active-date-divider::after {
  content: "";
  flex: 1 1 0;
  min-width: 24px;
  border-top: 1px solid var(--border-strong);
  opacity: 0.85;
}
.active-date-divider-label {
  white-space: nowrap;
}
.active-list-item {
  border: 1px solid var(--border-strong);
  background: rgba(255, 255, 255, 0.02);
}
.list li.session-list-item.thread-status-waiting-user {
  border: 5px solid rgba(211, 154, 82, 0.56);
  padding: 6px;
}
.active-session-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 14px;
}
.active-session-title {
  min-width: 0;
  flex: 1 1 auto;
}
.active-session-actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: 8px;
  flex: 0 0 auto;
}
.active-toolbar {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.notification-preview {
  margin: 10px 0 0;
}
.notification-details {
  margin-top: 10px;
}
.notification-body {
  margin: 8px 0 0;
  padding: 12px 14px;
  background: var(--code);
  border: 1px solid var(--border);
  border-radius: 10px;
  overflow: auto;
  white-space: pre-wrap;
  word-break: break-word;
  font-size: 13px;
  line-height: 1.5;
}
.notification-headers {
  margin-top: 8px;
}
.notification-headers p {
  margin: 0 0 6px;
}
.active-toolbar-row,
.active-day-nav {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.session-list-item.search-result {
  border: 1px solid var(--border-strong);
  margin: 12px 0;
}
.session-list-item:hover,
.session-list-item:focus-within {
  box-shadow: inset 0 0 0 9999px rgba(255, 255, 255, 0.05);
  cursor: pointer;
}
.pagination {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 10px 0 14px;
  flex-wrap: wrap;
}
.page-meta {
  color: var(--muted);
  font-size: 12px;
}
.filter-form {
  margin-top: 6px;
}
.filter-toggle {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  color: var(--muted);
}
.filter-checkbox {
  width: 16px;
  height: 16px;
  accent-color: var(--accent);
}
.filter-label {
  user-select: none;
}
.link-item-link:hover {
  background: transparent;
}
.link-item-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.dir-item .link-item-link {
  padding: 10px 12px;
  border-radius: inherit;
}
.dir-filter-item .link-item-link {
  padding: 8px 10px;
  border-radius: inherit;
}
.meta {
  color: var(--muted);
  font-size: 14px;
}
summary.meta {
  cursor: pointer;
}
.session-item {
  padding: 16px;
  border-radius: 10px;
  margin-bottom: 16px;
  border: 1px solid var(--border);
  background: var(--panel);
  scroll-margin-top: calc(var(--sticky-offset, 180px) + 8px);
}
.turn-aborted-item {
  margin: 8px 0 16px;
  margin-left: 33%;
  padding: 0;
  border: none;
  background: transparent;
  scroll-margin-top: calc(var(--sticky-offset, 180px) + 8px);
}
.turn-aborted-text {
  margin: 0;
  color: #ff6b6b;
  font-size: 14px;
  line-height: 1.6;
}
.session-anchor {
  display: block;
  height: 0;
  width: 0;
  scroll-margin-top: calc(var(--sticky-offset, 180px) + 8px);
}
.session-item.role-user { background: var(--user); }
.session-item.role-assistant { background: var(--assistant); }
.session-item.speaker-user {
  background: var(--speaker-user-bg);
  border-color: var(--speaker-user-border);
  box-shadow: inset 0 0 0 1px var(--speaker-user-glow);
}
.session-item.speaker-agent {
  background: var(--speaker-agent-bg);
  border-color: var(--speaker-agent-border);
  box-shadow: inset 0 0 0 1px var(--speaker-agent-glow);
}
.session-item.speaker-subagent {
  background: var(--speaker-subagent-bg);
  border-color: var(--speaker-subagent-border);
  box-shadow: inset 0 0 0 1px var(--speaker-subagent-glow);
}
.session-item.role-tool { background: var(--tool); }
.session-item.role-system, .session-item.role-unknown { background: var(--system); }
.session-item.role-error { background: var(--error); }
.session-item.auto-context {
  border-color: rgba(73, 193, 181, 0.35);
  box-shadow: inset 0 0 0 1px rgba(73, 193, 181, 0.18);
}
.session-item.speaker-subagent.subagent-notification,
.session-item.subagent-notification {
  margin-left: 7%;
  margin-right: 33%;
  background:
    linear-gradient(180deg, rgba(25, 47, 29, 0.98), rgba(15, 30, 19, 0.95));
  border-color: rgba(146, 196, 96, 0.34);
  box-shadow: inset 0 0 0 1px rgba(146, 196, 96, 0.14);
}
.session-item.role-user {
  margin-left: 33%;
}
.session-item.role-assistant,
.session-item.role-tool {
  margin-right: 33%;
}
.session-header {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: baseline;
  margin-bottom: 10px;
}
.session-group-details {
  margin: 8px 0 10px;
}
.session-group-details[open] {
  margin-bottom: 16px;
}
.session-group-header {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  align-items: baseline;
  margin-right: 33%;
  padding: 0 4px;
  cursor: pointer;
  list-style: none;
}
.session-group-header::-webkit-details-marker {
  display: none;
}
.session-group-title {
  font-size: 16px;
  font-weight: 600;
  color: var(--ink);
}
.session-group-title::before {
  content: "▶";
  display: inline-block;
  margin-right: 8px;
  font-size: 11px;
  transition: transform 0.14s ease;
}
.session-group-details[open] .session-group-title::before {
  transform: rotate(90deg);
}
.session-group-body {
  margin-top: 10px;
}
.copy-btn {
  border: 1px solid var(--border);
  background: transparent;
  color: var(--accent);
  padding: 4px 10px;
  border-radius: 999px;
  font-size: 12px;
  cursor: pointer;
}
.copy-btn:hover {
  background: var(--border);
}
.share-form {
  display: inline-block;
  margin: 0;
}
.session-page-toolbar {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.session-page-toolbar-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 14px;
}
.session-page-thread-row {
  align-items: flex-start;
}
.session-page-thread-fields,
.session-page-thread-actions,
.session-page-jump-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}
.session-page-thread-fields {
  min-width: 0;
  flex: 0 1 auto;
  align-items: flex-start;
}
.session-page-thread-actions {
  margin-left: auto;
  flex: 0 1 auto;
  justify-content: flex-end;
  row-gap: 10px;
}
.session-page-thread-state-group {
  display: inline-flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 8px;
}
.session-page-thread-field {
  display: inline-flex;
  align-self: stretch;
  align-items: center;
  gap: 8px;
  min-width: 0;
  padding: 5px 10px;
  border-radius: 999px;
  border: 1px solid var(--border);
  background: rgba(255, 255, 255, 0.02);
}
.session-page-thread-field-link {
  color: inherit;
  text-decoration: none;
}
.session-page-thread-field-link:hover {
  border-color: var(--accent);
  background: rgba(255, 255, 255, 0.05);
}
.session-page-thread-field-link:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}
.session-page-thread-field span:last-child {
  min-width: 0;
  overflow-wrap: anywhere;
}
.session-page-branch-icon {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 14px;
  height: 14px;
  color: var(--accent);
}
.session-page-branch-icon-svg {
  width: 14px;
  height: 14px;
  fill: currentColor;
}
.session-page-thread-actions .nav-btn,
.session-page-thread-state-group,
.session-page-toolbar-separator {
  white-space: nowrap;
}
.session-page-thread-state-label,
.session-page-jump-label {
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-size: 11px;
}
.session-page-toolbar-separator {
  color: var(--muted);
  opacity: 0.8;
}
.session-page-jump-row {
  justify-content: flex-start;
  align-items: center;
}
@media (max-width: 1280px) {
  .session-page-thread-actions {
    flex-basis: 100%;
    margin-left: 0;
    justify-content: flex-end;
  }
  .session-page-thread-state-group {
    justify-content: flex-end;
  }
}
.share-banner {
  margin-top: 8px;
  padding: 8px 12px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--banner);
  color: var(--ink);
  opacity: 0;
  transform: translateY(-4px);
  transition: opacity 0.2s ease, transform 0.2s ease;
}
.share-banner.visible {
  opacity: 1;
  transform: translateY(0);
}
.share-banner.error {
  border-color: #b65b5b;
  color: #ffd6d6;
}
.copy-source {
  position: absolute;
  left: -9999px;
  top: 0;
  height: 0;
  width: 0;
  opacity: 0;
}
.session-title {
  font-weight: bold;
}
.session-type {
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--muted);
}
.session-content {
  font-size: 14px;
  line-height: 1.6;
  word-break: break-word;
}
.session-content > *:first-child {
  margin-top: 0;
}
.session-content > *:last-child {
  margin-bottom: 0;
}
.session-content p {
  margin: 0 0 0.9em;
